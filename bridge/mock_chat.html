<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mock chat · ทดสอบ Friday bridge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 14px/1.6 system-ui, "Segoe UI", sans-serif; background: #101018; color: #eae7f4; }
  header { padding: 10px 16px; border-bottom: 1px solid #262336; color: #a99ee0; font-size: 12px; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; width: fit-content; }
  .me { align-self: flex-end; background: #5b45c9; }
  .bot { align-self: flex-start; background: #1e1c2a; border: 1px solid #2c293a; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #262336; }
  textarea { flex: 1; resize: none; height: 52px; padding: 10px 12px; border-radius: 10px;
             border: 1px solid #33303f; background: #1a1822; color: inherit; font: inherit; }
  button { align-self: flex-end; height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid #6f55ee;
           background: #5b45c9; color: #fff; font: inherit; cursor: pointer; }
  footer { padding: 6px 16px 12px; font-size: 11px; color: #6f6a85; }
</style>
</head>
<body>
<header>MOCK CHAT — หน้าทดสอบในเครื่องคุณ ไม่ใช่ Arena (ใช้ยืนยันว่า extension + bridge ทำงานครบวงจร)</header>
<div id="transcript">
  <div class="msg bot">ทดสอบ: พิมพ์อะไรมาก็ได้ ผมจะตอบกลับเองใน ~1 วินาที</div>
</div>
<form id="composer-form">
  <textarea id="composer" placeholder="Message the assistant…" aria-label="Message"></textarea>
  <button type="submit" id="send" aria-label="Send message">Send</button>
</form>
<footer>ตรวจว่า content.js หาช่องพิมพ์เจอ · ใส่ marker · รอข้อความนิ่ง · ส่งคำตอบกลับ bridge</footer>
<script>
  const transcript = document.getElementById("transcript");
  const form = document.getElementById("composer-form");
  const box = document.getElementById("composer");
  let count = 0;

  function bubble(text, who) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
    return el;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = box.value.trim();
    if (!text) return;
    bubble(text, "me");
    box.value = "";
    count += 1;
    const marker = (text.match(/\[friday:[a-z0-9-]+\]/i) || [""])[0];
    setTimeout(() => {
      const reply = marker
        ? "ได้รับคำถามแล้ว (marker " + marker + ")\n\nคำตอบจำลอง #" + count +
          ": 1) ตรวจ log 2) ถ้าเจอ 4001 แปลว่า key เก่า 3) ยืนยันด้วย VERDICT: OK"
        : "ได้รับข้อความ (" + text.length + " ตัวอักษร) — ไม่พบ marker [friday:…]";
      bubble(reply, "bot");
    }, 1000);
  });

  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
