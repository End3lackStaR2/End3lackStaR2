<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
           background: #14131a; color: #e9e6f2; }
    h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .02em; color: #b9a8ff; }
    label { display: block; margin: 8px 0 2px; font-size: 11px; color: #9d97b3; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
            border: 1px solid #33303f; background: #1c1a24; color: #e9e6f2; font: inherit; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #3c3750;
             background: #241f33; color: #e9e6f2; font: inherit; cursor: pointer; }
    button.primary { background: #5b45c9; border-color: #6f55ee; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #1c1a24;
              border: 1px solid #2c293a; font-size: 12px; white-space: pre-wrap; min-height: 34px; }
    .ok { color: #7ee0a5; } .bad { color: #ff9c9c; }
    .hint { margin-top: 8px; font-size: 11px; color: #7f7a94; }
  </style>
</head>
<body>
  <h1>Friday bridge</h1>

  <label for="port">Port</label>
  <input id="port" type="number" min="1" max="65535" value="8787">

  <label for="token">Token (from bus/.local/bridge.token)</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="paste the token">

  <div class="row" style="margin-top:10px">
    <button id="save">Save</button>
    <button id="check">Test</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="attach" class="primary">Attach to this tab</button>
  </div>

  <div id="status">ยังไม่ได้เชื่อมต่อ</div>
  <div class="hint">Attach = ให้ Friday พิมพ์ถามในแท็บนี้ได้ จนกว่าจะปิดแท็บ/รีโหลด</div>

  <script src="popup.js"></script>
</body>
</html>
