# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions workflow "kick-pusher-probe" — เป็น template ให้ก๊อปไปใช้
#
# ทำไมต้องก๊อปเอง: token ที่ใช้ push โค้ดอัตโนมัติไม่มีสิทธิ์ `workflow` GitHub จึง
# ปฏิเสธการสร้างไฟล์ใน .github/workflows/ ให้ (ต้องทำผ่านหน้าเว็บครั้งเดียว)
#
# ได้อะไร: รัน `ws_probe.py --discover` + `tools/pusher_sweep.py` จากเครือข่ายของ
# GitHub (คนละทางกับเครื่องคุณ) แล้วแนบผลเป็นตารางในหน้า run + ไฟล์ sweep_result.json
#   - ถ้าที่นั่นต่อได้ด้วย key ใหม่ = ปัญหาอยู่ที่เครื่อง/เน็ตฝั่งคุณ
#   - ถ้าที่นั่นก็ยังไม่ได้ = ปัญหาอยู่ที่ค่าที่ตั้ง/key เอง
#
# วิธีใช้ (เลือกทางใดทางหนึ่ง)
#
#   ทาง A — คลิกเดียว (แนะนำ): เปิดลิงก์ "เติมไฟล์ให้" ที่ให้ไว้ในหัวข้อ 0.6 ของ
#           kick-chat-fix.md → จะเปิดหน้า New file พร้อมชื่อไฟล์และเนื้อหาครบ
#           → กด "Commit changes" → workflow จะรันเองทันที (เพราะ trigger เป็น push)
#
#   ทาง B — ทำมือ 4 ขั้น:
#     1. เปิด https://github.com/End3lackStaR2/End3lackStaR2/new/arena/2a41429a-end3lackstar2
#     2. ตั้งชื่อไฟล์:  .github/workflows/kick-probe.yml
#     3. วางเนื้อหาด้านล่างทั้งหมด → Commit changes
#     4. เปิดแท็บ Actions → ดูผลของ run "kick-pusher-probe"
#
# หมายเหตุสำคัญเรื่อง trigger:
#   - `push` ทำงานได้ทุกสาขา → พอ commit ไฟล์นี้ มันรันให้เลย
#   - `workflow_dispatch` (ปุ่ม "Run workflow") จะโผล่เฉพาะเมื่อไฟล์นี้อยู่บนสาขาหลัก
#     (main) เท่านั้น — ถ้ายังไม่เห็นปุ่ม ไม่ใช่ความผิดพลาด ให้ดูผลจากรอบที่ push แทน
# ─────────────────────────────────────────────────────────────────────────────
name: kick-pusher-probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kick-probe.yml"
      - "tools/pusher_sweep.py"
      - "ws_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งค่า Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ถาม Kick ว่าให้ใช้ Pusher app ไหน
        run: python ws_probe.py --discover --timeout 8 || true

      - name: ทดสอบทุก cluster × ทุก key
        run: python tools/pusher_sweep.py --discover --check-kick --json sweep_result.json --timeout 6

      - name: แนบผลลัพธ์
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-result
          path: sweep_result.json
          if-no-files-found: ignore
